<!doctype html><html lang="ko"><meta charset="utf-8"><title>환경설정 Description 정리</title><style>body{font:14px sans-serif;margin:24px;color:#222}button{padding:10px 20px;margin:8px}pre{white-space:pre-wrap;border:1px solid #ccc;padding:16px}h1{font-size:22px}</style><body data-project="gfair_cs" data-screen="SET-01"><h1>환경설정 Description 검토·저장</h1><p>기존 설명 ID·번호·댓글·기획비고를 유지하고 변경한 필드만 빨간색으로 표시합니다. 저장은 아래 버튼을 누를 때만 실행합니다.</p><button id="apply" disabled>검토한 설명 서버 저장</button><p id="status">설명 불러오는 중</p><pre id="report"></pre><div id="app"></div><script src="../common/config.js"></script><script src="../common/include/collaboration.js?v=journal-delete-descriptions-20261111"></script><script>
const patches={"SET-11":[{"item":"기본정보","fields":{"detail":"- 설문 제목·대상·기간 등 기본정보를 입력하고, 상세에서는 저장된 내용을 조회·수정한다.","policy":"- 기본정보는 모두 필수 입력한다.\n- 등록 시 현재 행사 연도·행사 마지막 날·사용을 기본 표시한다.\n- 설문 참여는 행사 마지막 날부터 가능하며, 조사 종료일은 두지 않는다."}},{"item":"설문정보","fields":{"detail":"- 그룹·문항·보기를 추가·삭제하여 설문을 구성한다.\n- 그룹·문항을 개별 또는 전체로 펼치거나 접는다.\n- 그룹 추가 시 추가된 그룹으로 이동하고, 문항 추가·삭제 시 번호와 ‘문항 N개’ 배지를 갱신한다.","policy":"- 등록 시 빈 그룹 1개와 문항 1개를 제공하고, 상세에서는 저장된 구성을 표시한다.\n- 그룹명·문항 내용은 필수 입력하며, 최소 그룹 1개·그룹별 문항 1개를 유지한다.\n- 첫 그룹은 삭제할 수 없다. 그룹에 문항이 1개이면 삭제 아이콘을 숨기고, 2개 이상이면 첫 문항도 삭제할 수 있다.\n- 문항 번호는 그룹과 관계없이 연속으로 표시하며, 그룹을 접어도 문항 수 배지는 유지한다.\n- 문항 수정 시 다른 문항의 값과 펼침 상태는 유지한다. 문항·보기 순서 변경은 제공하지 않는다."}},{"item":"문항 구분","fields":{"detail":"- 단일응답형·복수응답형·척도형은 보기 입력 영역을 표시하고, 보기 추가·삭제 시 개수 배지를 갱신한다.\n- 단답형·서술형은 보기 입력 없이 응답 화면에 한 줄·여러 줄 입력란을 제공한다.\n- 복수응답형은 최대 선택 개수를 설정한다.","policy":"- 등록 시 단일응답형과 빈 보기 2개를 제공하고, 상세에서는 저장값을 표시한다.\n- 단일응답형·복수응답형·척도형으로 변경하면 빈 보기 2개로 초기화하며 척도 문구는 자동 입력하지 않는다.\n- 객관식 보기 내용은 최소 2개 입력한다. 보기 2개 이하일 때와 첫 보기에는 삭제 아이콘을 표시하지 않는다.\n- 복수응답형 최대 선택 개수는 보기 수 이내로 설정하며, 0은 제한 없음으로 처리한다."}},{"item":"응답에 따라 문항 이동","fields":{"detail":"- 토글을 켜면 보기별 [선택 시 이동] 드롭다운을 표시하고, 끄면 숨긴다.\n- 도움말 아이콘 클릭 시 이동 문항 지정과 기본 진행 방식을 안내한다.","policy":"- 단일응답형·척도형에만 제공한다.\n- 이동 문항 미지정 시 ‘기본 순서로 진행’을 기본값으로 표시하며, 응답할 수 없는 문항은 건너뛴다.\n- 뒤에 있는 문항만 이동 대상으로 제공하고, 지정 문항을 삭제하면 ‘기본 순서로 진행’으로 초기화한다.\n- 응답 조건을 충족하지 않은 문항도 화면에 유지하되 비활성화하고 기존 답변을 초기화한다. 필수 응답 검사·제출·통계에서는 제외한다."}},{"item":"부가정보 입력","fields":{"detail":"- 설정한 보기에 응답자가 추가 내용을 입력할 수 있도록 텍스트 입력란을 제공한다.","policy":"- 단일응답형·복수응답형 보기에만 제공하며, 척도형에는 제공하지 않는다.\n- 응답자가 해당 보기를 선택하면 입력을 활성화하고, 선택을 해제하면 입력값을 초기화한다.\n- 보기 응답과 추가 내용을 함께 저장하고 결과 조회 시 함께 표시한다."}},{"item":"응답이 있는 설문 수정 제한","fields":{"detail":"- 응답이 있는 상세는 조회 전용으로 표시하고 수정 제한 안내와 [복사하여 등록] 버튼을 제공한다.","policy":"- 응답이 없는 설문은 수정·저장할 수 있다.\n- 응답이 1건 이상이면 기본정보·문항·보기·이동 설정을 수정할 수 없다.\n- 복사본에는 설문 구성만 복사하며 기존 설문과 응답은 유지한다."}},{"item":"목록·미리보기·저장","fields":{"detail":"- [목록] 클릭 시 설문관리(SET-05)로 이동한다.\n- [미리보기] 클릭 시 현재 입력 내용을 SET-13 팝업으로 표시하고, 닫으면 편집 상태를 유지한다.\n- [저장] 클릭 시 등록·수정 내용을 저장하고 SET-05로 이동한다.","policy":"- 필수값·공백만 입력한 값·최소 구성·최대 선택 개수·이동 설정을 검사하며, 오류 시 저장하지 않고 입력값을 유지한다.\n- 미리보기는 저장·제출하지 않는다. 응답이 있는 상세는 저장 대신 [복사하여 등록]을 제공한다.\n- 저장하지 않은 변경사항이 있으면 목록·다른 메뉴·뒤로가기 이동 시 경고하고, 취소하면 입력값을 유지한다. 새로고침·탭 닫기는 브라우저 기본 경고를 사용한다."}},{"item":"필수 응답","fields":{"detail":"- 체크하면 해당 문항에 ‘필수’ 배지를 표시하고, 해제하면 숨긴다.","visibility":"","validation":"","policy":"- 등록·문항 추가 시 체크 상태를 기본 제공하고, 상세에서는 저장값을 표시한다.\n- 응답 화면에서는 활성화된 필수 문항에만 *를 표시하고 제출 시 응답 여부를 검사한다.\n- 비활성화된 문항은 필수 응답 검사에서 제외한다."}}],"SET-19":[{"item":"개인정보 접속 이력 목록","fields":{"detail":"- 검색 조건에 해당하는 개인정보 처리 이력을 목록으로 표시한다.","visibility":"","policy":"- 관리자 조회 전용으로 제공하며 발생 일시 최신순으로 표시한다.\n- 사용자·사용구분은 작업 계정의 이름과 권한을, 메뉴명은 상위 메뉴를 포함한 경로를 표시한다.\n- 정보주체는 작업 대상자의 이름·고유코드로 표시하고, 다수 대상은 구분·인원수로 표시한다.\n- 이력 수정·삭제와 상세 화면 이동은 제공하지 않는다."}},{"item":"개인정보 접속 이력 목록 - 작업 이력","fields":{"detail":"- 개인정보에 수행한 작업 유형을 표시한다.","policy":"- 목록 조회·상세 조회·개인정보 등록·수정·삭제·엑셀 일괄 업로드·엑셀 다운로드로 구분한다.\n- 실제 수행한 작업 유형으로 기록하며, 엑셀 일괄 업로드는 일괄 등록·갱신을 포함한다."}}],"SET-02":[{"item":"그룹 기본정보","create":true,"anchor":{"selector":"[data-group-form=\"edit\"] .group-information","sample":"","x":0,"y":0,"offsetX":-10,"offsetY":0},"fields":{"type":"기타","defaultValue":"선택한 그룹의 저장값","required":"Y","detail":"- 선택한 그룹명과 사용여부를 표시하고, 사용여부를 변경한다.","policy":"- 그룹명은 조회만 가능하며 변경할 수 없다.\n- 사용여부는 사용·미사용 중 하나를 필수 선택한다."}},{"item":"목록·저장","create":true,"anchor":{"selector":"[data-group-form=\"edit\"] .group-access-footer","sample":"","x":0,"y":0,"offsetX":-10,"offsetY":0},"fields":{"type":"버튼","defaultValue":"활성","required":"N","detail":"- [목록] 클릭 시 그룹권한관리(SET-01)로 이동한다.\n- [저장] 클릭 시 선택한 그룹의 사용여부를 반영하고 SET-01로 이동한다.","policy":"- 관리자만 조회·변경할 수 있다.\n- 저장하지 않고 목록으로 이동하면 변경값을 반영하지 않는다."}}]};
const routes=['BAS-02','BAS-09','SET-01','SET-02','SET-03','SET-05','SET-06','SET-11','SET-13','SET-14','SET-15','SET-16','SET-19','SET-01-p13','SET-18'];
const original=new Map();const report=document.querySelector('#report'),status=document.querySelector('#status'),button=document.querySelector('#apply');
async function list(screen){const response=await fetch(window.MOCKUP_SHARED_CONFIG.server+'/api/collab?'+new URLSearchParams({op:'list',project:'gfair_cs',screen}),{cache:'no-store'});if(!response.ok)throw Error(screen+' 조회 실패');return (await response.json()).records;}
(async()=>{try{const all=await Promise.all(routes.map(async screen=>{const records=await list(screen);original.set(screen,records);return {screen,records:records.map(r=>({id:r.id,number:r.number,spec:JSON.parse(r.text)}))};}));report.textContent=JSON.stringify(all,null,2);status.textContent='검토 준비 완료. 저장 대기';button.disabled=false;}catch(e){status.textContent=e.message;}})();
button.onclick=async()=>{button.disabled=true;const results=[];try{if(!window.GFAIR_COLLAB.user)throw Error('공동작업자 로그인 상태를 확인해 주세요.');for(const [screen,entries]of Object.entries(patches)){for(const entry of entries){const records=await list(screen),record=records.find(r=>{try{return JSON.parse(r.text).item===entry.item;}catch{return false;}}),old=record?JSON.parse(record.text):{},before=(original.get(screen)||[]).find(r=>r.id===record?.id);if(record&&before?.text!==record.text)throw Error(screen+' '+entry.item+'이 검토 후 변경되어 중단했습니다.');if(!record&&!entry.create)throw Error(screen+' '+entry.item+' 설명이 없습니다.');const spec={...old,format:'description-spec-v1',item:entry.item,...entry.fields},marks={...(old.codexHighlights||{})};let modified=false;for(const [key,value]of Object.entries(entry.fields)){if(value===old[key])continue;modified=true;delete marks[key];if(value)marks[key]=[{start:0,end:value.length,text:value}];}if(!record)marks.item=[{start:0,end:entry.item.length,text:entry.item}];if(!modified&&record){results.push(screen+' '+entry.item+': 변경 없음');continue;}if(Object.keys(marks).length)spec.codexHighlights=marks;else delete spec.codexHighlights;const result=await window.GFAIR_COLLAB.mutate(record?'update':'create',record?{id:record.id,revision:record.revision,text:JSON.stringify(spec)}:{screen,anchor:entry.anchor,text:JSON.stringify(spec)});const saved=(await list(screen)).find(r=>r.id===(result.id||record?.id));if(!saved||saved.text!==JSON.stringify(spec))throw Error(screen+' 저장 대조 실패');results.push(screen+' '+entry.item+': 저장·대조 완료');status.textContent=results.join('\n');}}status.textContent='완료: '+results.length+'개 항목 저장·대조';report.textContent=results.join('\n');}catch(e){status.textContent='중단: '+e.message;report.textContent=results.join('\n');}};
</script></body></html>
